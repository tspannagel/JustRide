<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JustRide Stats</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/uplot-1.6.32/uPlot.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>JustRide</h1>
  <nav>
    <button data-view="overview" class="active">Overview</button>
    <button data-view="curve">Power curve</button>
    <button data-view="rides">Rides</button>
    <button data-view="sql">SQL</button>
  </nav>
</header>
<main>
  <p id="status">Loading DuckDB...</p>
  <section id="overview" class="view">
    <div id="totals" class="cards"></div>
    <h2>Fitness (CTL 42 d) / Fatigue (ATL 7 d) / Form (TSB)</h2>
    <div id="pmc"></div>
  </section>
  <section id="curve" class="view" hidden>
    <p id="ftp"></p>
    <div id="curve-chart"></div>
  </section>
  <section id="rides" class="view" hidden>
    <div id="ride-list"></div>
    <div id="ride-detail" hidden>
      <button id="ride-back">&larr; All rides</button>
      <h2 id="ride-title"></h2>
      <div id="ride-cards" class="cards"></div>
      <div id="ride-chart"></div>
      <h3>Power zones</h3><div id="ride-zones"></div>
      <h3>Intervals</h3><div id="ride-intervals"></div>
    </div>
  </section>
  <section id="sql" class="view" hidden>
    <p>Tables: <code>summary</code>, <code>bests</code>, and <code>ride</code> (the ride last opened).</p>
    <textarea id="sql-text" rows="5">SELECT date_trunc('month', start_utc) AS month, count(*) AS rides,
       round(sum(tss)) AS tss, round(sum(duration_s) / 3600, 1) AS hours
FROM summary GROUP BY 1 ORDER BY 1 DESC</textarea>
    <button id="sql-run">Run</button>
    <div id="sql-out"></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
