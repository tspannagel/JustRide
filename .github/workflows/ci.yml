name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S test/host -B test/host/build
      - run: cmake --build test/host/build -j
      - run: ctest --test-dir test/host/build --output-on-failure
      # tools/mcp_server.py against tools/web_dev.py's sample backend (stdlib only)
      - run: python3 -m unittest discover -s test/tools -v

  firmware:
    name: Firmware build (ESP-IDF 5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: idf.py build
